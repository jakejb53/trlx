output_dir = "runs/kto-lines"
max_steps = 20
per_device_train_batch_size = 2
per_device_eval_batch_size = 2
learning_rate = 1e-4
logging_steps = 2
eval_strategy = "steps"
eval_steps = 10
save_strategy = "steps"
bf16 = true
report_to = "none"
max_length = 256

[model]
path = "Qwen/Qwen3-0.6B"
dtype = "bfloat16"


[dataset]
split = true
dataset = "kto.jsonl"
eval_fraction = 0.25

[peft]
r = 8
lora_alpha = 16
target_modules = "all-linear"

[ranges]
loss = [0.0, 5.0]
eval_loss = [0.0, 5.0]
"rewards/chosen" = [-10.0, 10.0]
"rewards/rejected" = [-10.0, 10.0]
kl = [0.0, 1.0]
grad_norm = [0.0, 10.0]

[preflight]
offpolicy_logp_per_token = -1.0
rows = 16
