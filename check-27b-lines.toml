output_dir = "runs/check-27b"
max_steps = 20
per_device_train_batch_size = 1
per_device_eval_batch_size = 1
learning_rate = 1e-4
logging_steps = 2
eval_strategy = "steps"
eval_steps = 10
save_strategy = "steps"
bf16 = true
report_to = "none"
max_length = 256

[model]
path = "Qwen/Qwen3.8-27B"
dtype = "bfloat16"

[dataset]
split = true
dataset = "sft.jsonl"
train = 60

[peft]
r = 8
lora_alpha = 16
target_modules = "all-linear"

[ranges]
loss = [0.0, 3.0]
eval_loss = [0.0, 3.0]
mean_token_accuracy = [0.3, 1.0]
grad_norm = [0.0, 10.0]
